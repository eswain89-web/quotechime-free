<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteChime Free Demo</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f5f1e8;color:#17211d}main{width:min(760px,calc(100% - 32px));margin:50px auto}form,article{background:#fff;padding:20px;border:1px solid #d7d2c7;border-radius:12px;margin:16px 0}label{display:grid;gap:5px;margin:12px 0;font-weight:700}input,select,button{font:inherit;padding:10px}button{background:#0f6b4f;color:#fff;border:0;border-radius:8px;font-weight:800}pre{white-space:pre-wrap;font:inherit}a{color:#0f6b4f}</style></head><body><main><h1>QuoteChime Free</h1><p>Four calm follow-up drafts. Everything stays in this browser.</p><form id="form"><label>Business<input name="business" value="Blue Gum Plumbing"></label><label>Customer first name<input name="customer" value="Sam"></label><label>Quoted work<input name="service" value="the bathroom tap replacement"></label><label>Amount AUD<input name="amount" value="1850"></label><label>Availability<input name="availability" value="the week starting 24 August"></label><label>Tone<select name="tone"><option value="warm">Warm</option><option value="direct">Direct</option></select></label><button>Build sequence</button></form><section id="output"></section><p><a href="https://quotechime.pages.dev/#generator">Use the full live generator</a> · <a href="https://quotechime.pages.dev/#kit">Complete operating kit</a></p></main><script type="module">import{buildSequence}from'../src/generator.js';const form=document.querySelector('#form'),output=document.querySelector('#output');form.addEventListener('submit',event=>{event.preventDefault();output.innerHTML='';for(const item of buildSequence(Object.fromEntries(new FormData(form)))){const article=document.createElement('article'),heading=document.createElement('strong'),body=document.createElement('pre');heading.textContent=`${item.timing} · ${item.channel}`;body.textContent=item.body;article.append(heading,body);output.append(article)}});</script></body></html>
